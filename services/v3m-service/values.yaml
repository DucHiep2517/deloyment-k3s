# v3m-service (app-customer-service, Spring Boot).
# Chỉ ghi những gì khác mặc định của charts/spring-service/values.yaml.
# Tên thư mục (v3m-service) = tên Deployment/Service/Ingress = tên Argo CD Application.

replicaCount: 2

image:
  repository: app-customer-service
  tag: "1.0.0"

containerPort: 9092

# Heap 60% của limit 2Gi (~1.2Gi), xem env JAVA_TOOL_OPTIONS trong chart
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

ingress:
  host: v3m.localhost
