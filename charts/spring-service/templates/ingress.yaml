{{- if .Values.ingress.enabled }}
# Request có Host = ingress.host (mặc định <tên service>.localhost) -> chuyển vào Service của chart (cổng http).
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "spring-service.fullname" . }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  {{- if .Values.ingress.tls.secretName }}
  # HTTPS: NGINX giải mã TLS bằng cert trong Secret, rồi gọi vào Service bằng HTTP
  tls:
    - hosts:
        - {{ include "spring-service.host" . | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}

  rules:
    - host: {{ include "spring-service.host" . | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "spring-service.fullname" . }}
                port:
                  name: http
{{- end }}
