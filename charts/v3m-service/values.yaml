# Giá trị mặc định cho chart v3m-service.
# Muốn đổi cấu hình (image, số pod, bộ nhớ, hostname...) thì sửa ở đây, không cần đụng templates/.

# Tên dùng cho Deployment, Service, Ingress và label "app". Để trống = tên chart (v3m-service).
# Lưu ý: đổi tên này sẽ đổi selector của Deployment (trường không sửa được) -> phải xoá Deployment cũ.
fullnameOverride: ""

replicaCount: 2

image:
  repository: app-customer-service
  # Để trống thì dùng appVersion trong Chart.yaml
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Cổng app Spring Boot lắng nghe trong container
containerPort: 9092

# Java 11 mặc định chỉ lấy 25% memory limit làm heap -> app bị OutOfMemoryError.
# Cho heap dùng 60% limit (~1.2Gi), phần còn lại cho metaspace, threads...
env:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60.0"

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # NGINX Ingress Controller (cài bởi argocd/nginx-ingress-application.yaml)
  className: nginx
  host: v3m.localhost
  path: /
  pathType: Prefix
