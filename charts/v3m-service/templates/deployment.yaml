apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "v3m-service.fullname" . }}
  labels:
    {{- include "v3m-service.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "v3m-service.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "v3m-service.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: {{ include "v3m-service.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
