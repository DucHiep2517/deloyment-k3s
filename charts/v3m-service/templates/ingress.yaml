{{- if .Values.ingress.enabled }}
# Request có Host = ingress.host -> chuyển vào Service của chart (cổng http).
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "v3m-service.fullname" . }}
  labels:
    {{- include "v3m-service.labels" . | nindent 4 }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "v3m-service.fullname" . }}
                port:
                  name: http
{{- end }}
