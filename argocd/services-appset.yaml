# deloyment-k3s
# Sinh tự động một Argo CD Application cho mỗi thư mục trong services/.
#   services/<tên>/values.yaml  ->  Application <tên>, chart charts/spring-service, namespace spring-app
# Thêm service: tạo thư mục mới + push. Xoá thư mục + push: Argo CD gỡ service đó khỏi cluster.
# Áp dụng một lần: kubectl apply -f argocd/services-appset.yaml
#
# Cẩn thận: xoá ApplicationSet này sẽ xoá mọi Application nó sinh ra, kéo theo toàn bộ service.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: services
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: https://github.com/DucHiep2517/deloyment-k3s.git
        revision: main
        directories:
          - path: services/*

  template:
    metadata:
      name: "{{ .path.basename }}"

    spec:
      project: default

      source:
        repoURL: https://github.com/DucHiep2517/deloyment-k3s.git
        targetRevision: main
        path: charts/spring-service
        helm:
          # Release name = tên thư mục -> tên Deployment/Service/Ingress
          releaseName: "{{ .path.basename }}"
          # Đường dẫn tính từ thư mục chart (charts/spring-service)
          valueFiles:
            - "../../{{ .path.path }}/values.yaml"

      destination:
        server: https://kubernetes.default.svc
        # Mọi service chung một namespace -> gọi nhau bằng http://<tên service>
        namespace: spring-app

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
