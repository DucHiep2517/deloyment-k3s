# deloyment-k3s
# Một Argo CD Application chứa mọi service Spring Boot (umbrella chart services/).
# Thêm/sửa service: sửa services/Chart.yaml + services/values.yaml rồi push, không cần apply lại file này.
# Áp dụng một lần: kubectl apply -f argocd/spring-app-application.yaml
#
# Không có finalizer resources-finalizer: xoá Application này chỉ bỏ quản lý, các service vẫn chạy.
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: spring-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/DucHiep2517/deloyment-k3s.git
    targetRevision: main
    # Umbrella chart: Argo CD tự chạy helm dependency build để lấy charts/spring-service
    path: services

  destination:
    server: https://kubernetes.default.svc
    namespace: spring-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
