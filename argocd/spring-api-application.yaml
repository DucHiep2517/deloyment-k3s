# deloyment-k3s

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: app-customer-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/DucHiep2517/deloyment-k3s.git
    targetRevision: main
    # Helm chart của app (Argo CD tự nhận ra Helm nhờ Chart.yaml)
    path: charts/v3m-service
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: spring-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
