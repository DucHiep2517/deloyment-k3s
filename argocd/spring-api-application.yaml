# deloyment-k3s

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: app-customer-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/DucHiep2517/deloyment-k3s.git
    targetRevision: main
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: spring-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
