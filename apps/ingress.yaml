# deloyment-k3s
# Quy tắc cho NGINX Ingress Controller (cài bởi argocd/nginx-ingress-application.yaml):
# request có Host = v3m.localhost -> chuyển vào svc/v3m-service cổng http (80 -> pod 9092).
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: v3m-service

spec:
  ingressClassName: nginx

  rules:
    - host: v3m.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: v3m-service
                port:
                  name: http
