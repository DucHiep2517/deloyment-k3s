apiVersion: v2
name: v3m
description: Hệ thống v3m (Spring Boot). ApplicationSet apps tạo Application + namespace v3m.
type: application

# Phiên bản của umbrella chart: tăng khi thêm/bớt service
version: 0.1.0

# Mỗi service = một lần dùng lại chart spring-service với alias riêng.
# alias = tên Deployment/Service/Ingress = tên mục cấu hình trong values.yaml.
# Thêm service: thêm một khối dưới đây + một mục cùng tên trong values.yaml.
dependencies:
  - name: spring-service
    alias: app-customer-service
    version: ">=0.1.0"
    repository: file://../../charts/spring-service

  - name: spring-service
    alias: sync-data-crm
    version: ">=0.1.0"
    repository: file://../../charts/spring-service

  - name: spring-service
    alias: gateway-server
    version: ">=0.1.0"
    repository: file://../../charts/spring-service
