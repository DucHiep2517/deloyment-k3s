# Hệ thống v3m: Application v3m, namespace v3m.
# Mỗi mục phải trùng alias trong Chart.yaml, và chỉ ghi những gì khác
# mặc định của charts/spring-service/values.yaml.
# Service mặc định là nội bộ (không có Ingress), gọi nhau qua http://<tên service> (cổng 80).
# Hệ thống khác gọi vào qua http://<tên service>.v3m

# app-customer-service
app-customer-service:
  replicaCount: 2

  image:
    repository: app-customer-service
    tag: "1.0.0"

  # server.port trong application.yml
  containerPort: 9092

  # Heap 60% của limit 2Gi (~1.2Gi), xem env JAVA_TOOL_OPTIONS trong chart
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

sync-data-crm:
  image:
    repository: sync-data-crm
    tag: "1.0.0"

  # server.port trong application.yml
  containerPort: 8084

# Zuul gateway: service duy nhất mở ra ngoài cluster
#   https://gateway.localhost (cổng 443, hoặc 8443)   và   http://gateway.localhost:8080
gateway-server:
  image:
    repository: gateway-server
    tag: "1.0.1"

  # server.port trong application.yml
  containerPort: 9095

  # application.yml trong image trỏ theo môi trường cũ (localhost:9092, v3m-...-service).
  # SPRING_APPLICATION_JSON được Spring Boot ưu tiên hơn application.yml -> đổi sang tên Service trong cluster,
  # không cần build lại image. Ghi đè env thì list mặc định bị thay hẳn -> phải ghi lại JAVA_TOOL_OPTIONS.
  env:
    - name: JAVA_TOOL_OPTIONS
      value: "-XX:MaxRAMPercentage=60.0"
    - name: SPRING_APPLICATION_JSON
      value: >-
        {"service":{"gateway":{"authorization":{"url":"http://app-customer-service/auth/check"}}},
        "zuul":{"routes":{
        "app":{"url":"http://app-customer-service"},
        "api":{"url":"http://app-customer-service"},
        "sync-data-crm":{"url":"http://sync-data-crm"}}}}

  ingress:
    enabled: true
    host: gateway.localhost

    # Cert tự ký trong Secret gateway-tls (namespace v3m), tạo bằng kubectl từ certs/ (không có trong Git).
    # NGINX giải mã TLS rồi gọi vào gateway bằng HTTP như cũ, app không cần sửa gì.
    tls:
      secretName: gateway-tls

    annotations:
      # Giữ HTTP 8080 song song HTTPS (không tự chuyển sang https://).
      # Đổi thành "true" nếu muốn ép mọi request HTTP sang https://gateway.localhost (cổng 443).
      nginx.org/ssl-redirect: "false"
