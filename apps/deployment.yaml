# deloyment-k3s
apiVersion: apps/v1
kind: Deployment

metadata:
  name: v3m-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: v3m-service

  template:
    metadata:
      labels:
        app: v3m-service

    spec:
      containers:
        - name: v3m-service

          image: app-customer-service:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9092
              protocol: TCP

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: 1000m
              memory: 1Gi
