# deloyment-k3s
apiVersion: apps/v1
kind: Deployment

metadata:
  name: v3m-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: v3m-service

  template:
    metadata:
      labels:
        app: v3m-service

    spec:
      containers:
        - name: v3m-service

          image: app-customer-service:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 9092
              protocol: TCP

          # Java 11 mặc định chỉ lấy 25% memory limit làm heap -> app bị OutOfMemoryError.
          # Cho heap dùng 60% limit (~1.2Gi), phần còn lại cho metaspace, threads...
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0"

          resources:
            requests:
              cpu: 250m
              memory: 1Gi

            limits:
              cpu: 1000m
              memory: 2Gi
